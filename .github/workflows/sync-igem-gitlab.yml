name: Sync main to iGEM GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-igem-gitlab
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push sync branch and open GitLab merge request
        env:
          GITLAB_TOKEN: ${{ secrets.IGEM_GITLAB_TOKEN }}
        run: |
          set -eu

          if [ -z "$GITLAB_TOKEN" ]; then
            echo "IGEM_GITLAB_TOKEN is not configured."
            exit 1
          fi

          SYNC_BRANCH="github-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "iGEM Toronto sync"
          git config user.email "igem@g.skule.ca"
          git branch github-main "$GITHUB_SHA"
          git remote add igem "https://oauth2:${GITLAB_TOKEN}@gitlab.igem.org/2026/toronto.git"
          git fetch igem main
          git switch -c "$SYNC_BRANCH" igem/main
          git merge --no-edit github-main
          git push -u igem "$SYNC_BRANCH" \
            -o merge_request.create \
            -o merge_request.target=main \
            -o merge_request.remove_source_branch \
            -o merge_request.title="Sync GitHub main (${GITHUB_SHA})"
